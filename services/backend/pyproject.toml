[project]
name = "wavedesk-backend"
version = "0.1.0"
description = "WaveDesk backend — FastAPI + SQLAlchemy + Postgres (Frappe rewrite, plan: docs/rewrite/backend-rewrite-plan.md)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.0",
    "rq>=1.16",
    "bcrypt>=4.1",
    "pydantic-settings>=2.3",
    "python-socketio>=5.11",
    "cryptography>=42",
    "anthropic>=0.39",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
