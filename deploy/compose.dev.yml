# WaveDesk — full local dev stack
# Usage: docker compose -f deploy/compose.dev.yml up
# The app backend (services/backend, FastAPI) runs via uvicorn (see
# services/backend/README) and connects to postgres/redis below on localhost.

name: wavedesk-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wavedesk_pg}
      POSTGRES_DB: ${POSTGRES_DB:-wavedesk}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-devminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-devminio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  # Self-hosted faster-whisper transcription service (P4.5).
  whisper:
    build:
      context: ../services/whisper
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE: ${WHISPER_COMPUTE:-int8}
    ports:
      - "9010:9010"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9010/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  # One-shot: create the session-snapshot bucket so the gateway can persist.
  minio-init:
    image: minio/mc:latest
    entrypoint: >
      /bin/sh -c "
      mc alias set dev http://minio:9000 ${MINIO_ROOT_USER:-devminio} ${MINIO_ROOT_PASSWORD:-devminio123} &&
      mc mb --ignore-existing dev/wavedesk-sessions &&
      mc mb --ignore-existing dev/wavedesk-media"
    depends_on:
      minio:
        condition: service_healthy

  wa-gateway:
    build:
      context: ../services/wa-gateway
    environment:
      WA_GATEWAY_PORT: "8081"
      LOG_LEVEL: debug
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: wavedesk-sessions
      S3_MEDIA_BUCKET: wavedesk-media
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-devminio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-devminio123}
      WA_GATEWAY_INTERNAL_SECRET: ${WA_GATEWAY_INTERNAL_SECRET:-dev-internal-secret}
      # Dev-only defaults — staging/prod inject real values from secrets.
      SESSION_SNAPSHOT_KEY: ${SESSION_SNAPSHOT_KEY:-QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-dev-verify-token}
      META_APP_SECRET: ${META_APP_SECRET:-dev-meta-app-secret}
      CLOUD_API_NUMBERS: ${CLOUD_API_NUMBERS:-{}}
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  qdrant-data:
