name: Deploy staging

on:
  push:
    branches: [main]

# Runs only when the staging secrets exist — safe to merge before the VM does.
jobs:
  build-push:
    name: Build & push images
    runs-on: ubuntu-latest
    if: ${{ vars.STAGING_ENABLED == 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/wa-gateway
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wavedesk-gateway:latest,ghcr.io/${{ github.repository_owner }}/wavedesk-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wavedesk-frontend:latest,ghcr.io/${{ github.repository_owner }}/wavedesk-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to staging VM
    runs-on: ubuntu-latest
    needs: build-push
    if: ${{ vars.STAGING_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose file to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: deploy/compose.staging.yml
          target: ~/wavedesk/
          strip_components: 1
      - name: Pull & restart stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ~/wavedesk
            docker compose -f compose.staging.yml pull
            docker compose -f compose.staging.yml up -d
      - name: Smoke test
        run: |
          sleep 20
          curl -fsS "https://gw.${{ vars.STAGING_DOMAIN }}/health"
          curl -fsS "https://app.${{ vars.STAGING_DOMAIN }}/health"
