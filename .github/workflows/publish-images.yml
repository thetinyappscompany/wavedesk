name: Publish images

# Builds and pushes every production image to GHCR — CapRover (or any host)
# deploys them by image name. PRs that touch the frappe image build it
# WITHOUT pushing (build verification only).
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/frappe/**"
      - ".github/workflows/publish-images.yml"

jobs:
  images:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wavedesk-frappe
            context: .
            file: deploy/frappe/Dockerfile
          - name: wavedesk-gateway
            context: services/wa-gateway
            file: services/wa-gateway/Dockerfile
          - name: wavedesk-frontend
            context: .
            file: frontend/Dockerfile
          - name: wavedesk-whisper
            context: services/whisper
            file: services/whisper/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # ghcr image refs must be lowercase; the repo owner isn't.
      - name: Lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
